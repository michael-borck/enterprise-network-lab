# Perth (HQ) resolver — authoritative source for corp.lab.
# No upstream: the lab is an island, anything outside corp.lab is NXDOMAIN.
no-resolv
domain-needed
bogus-priv
domain=corp.lab
local=/corp.lab/
expand-hosts
no-hosts
# Serve records with a real TTL so the branch-office resolvers can cache
# them (dnsmasq's default for local records is 0 = never cache).
local-ttl=300

# ── corp.lab records ─────────────────────────────────────────────
host-record=intranet.corp.lab,10.10.20.80
host-record=dns.perth.corp.lab,10.10.20.53
host-record=dns.london.corp.lab,10.20.10.53
host-record=dns.la.corp.lab,10.30.10.53
host-record=gw.perth.corp.lab,10.10.10.254
host-record=gw.london.corp.lab,10.20.10.254
host-record=gw.la.corp.lab,10.30.10.254
host-record=ws1.perth.corp.lab,10.10.10.101
host-record=ws1.london.corp.lab,10.20.10.101
host-record=ws1.la.corp.lab,10.30.10.101
