name: enterprise-network-lab

# Three-office enterprise: Perth (HQ), London, LA.
# Offices are joined by point-to-point WAN links shaped with tc netem,
# routed by FRR (OSPF). Traffic between subnets can only flow through
# the router containers.

# Two Docker behaviours must be disabled for routing *through* a container
# to work: raw-table anti-spoofing rules (Docker >= 28) that drop any frame
# whose destination IP is not an endpoint on the receiving network, and the
# DOCKER-INTERNAL chain of `internal: true` networks, which drops all
# off-subnet traffic. Hence: "routed" gateway mode, and no `internal` flag
# ("routed" also disables NAT, so the lab has no path to the outside anyway).
x-routed-bridge: &routed
  com.docker.network.bridge.gateway_mode_ipv4: routed
  # Podman/netavark >= 2 (Podman 6) isolates bridge networks from each other by
  # default. This lab routes *through* multi-homed containers, so every network
  # must opt out. Docker ignores this option (it has its own isolation rules).
  isolate: "false"

x-workstation: &workstation
  image: nicolaka/netshoot:latest
  cap_add: [NET_ADMIN]
  volumes:
    - ./scripts/init-workstation.sh:/init.sh:ro
    - ./scripts/attack-demo.sh:/attack-demo.sh:ro
  command: ["bash", "/init.sh"]

services:
  # ── Routers ────────────────────────────────────────────────────────
  perth-router:
    build: images/router
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      # egress delay per WAN link (half the RTT; the far side adds the rest)
      WAN_DELAY: "172.16.1.=delay 125ms;172.16.2.=delay 75ms;172.16.4.=delay 300ms 20ms distribution normal loss 0.5%"
    volumes:
      - ./config/frr/perth:/etc/frr
      - ./config/nftables:/etc/nftables.lab.d:ro
      - ./pcaps:/pcaps
    networks:
      perth-users:   {ipv4_address: 10.10.10.254}
      perth-servers: {ipv4_address: 10.10.20.254}
      perth-dmz:     {ipv4_address: 10.10.30.254}
      wan-perth-london:  {ipv4_address: 172.16.1.1}
      wan-perth-la:      {ipv4_address: 172.16.2.1}
      wan-perth-pilbara: {ipv4_address: 172.16.4.1}

  london-router:
    build: images/router
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      WAN_DELAY: "172.16.1.=delay 125ms;172.16.3.=delay 70ms"
    volumes:
      - ./config/frr/london:/etc/frr
    networks:
      london-users: {ipv4_address: 10.20.10.254}
      wan-perth-london: {ipv4_address: 172.16.1.2}
      wan-london-la:    {ipv4_address: 172.16.3.1}

  la-router:
    build: images/router
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      WAN_DELAY: "172.16.2.=delay 75ms;172.16.3.=delay 70ms"
    volumes:
      - ./config/frr/la:/etc/frr
    networks:
      la-users: {ipv4_address: 10.30.10.254}
      wan-perth-la:  {ipv4_address: 172.16.2.2}
      wan-london-la: {ipv4_address: 172.16.3.2}

  # Pilbara mine site: a remote operation on a satellite link -- 600ms
  # round trip, jitter, and a little loss. Deliberately has NO local DNS
  # resolver, so every name lookup makes the satellite trip to Perth.
  pilbara-router:
    build: images/router
    cap_add: [NET_ADMIN, NET_RAW, SYS_ADMIN]
    sysctls: [net.ipv4.ip_forward=1]
    environment:
      WAN_DELAY: "172.16.4.=delay 300ms 20ms distribution normal loss 0.5%"
    volumes:
      - ./config/frr/pilbara:/etc/frr
    networks:
      pilbara-users: {ipv4_address: 10.40.10.254}
      wan-perth-pilbara: {ipv4_address: 172.16.4.2}

  # ── DNS (one resolver per office; Perth is authoritative for corp.lab)
  perth-dns:
    build: images/dns
    cap_add: [NET_ADMIN]
    environment: {GATEWAY: 10.10.20.254}
    volumes:
      - ./config/dns/perth.conf:/etc/dnsmasq.conf:ro
    networks:
      perth-servers: {ipv4_address: 10.10.20.53}

  london-dns:
    build: images/dns
    cap_add: [NET_ADMIN]
    environment: {GATEWAY: 10.20.10.254}
    volumes:
      - ./config/dns/london.conf:/etc/dnsmasq.conf:ro
    networks:
      london-users: {ipv4_address: 10.20.10.53}

  la-dns:
    build: images/dns
    cap_add: [NET_ADMIN]
    environment: {GATEWAY: 10.30.10.254}
    volumes:
      - ./config/dns/la.conf:/etc/dnsmasq.conf:ro
    networks:
      la-users: {ipv4_address: 10.30.10.53}

  # ── Services ───────────────────────────────────────────────────────
  intranet:
    build: images/web
    cap_add: [NET_ADMIN]
    environment: {GATEWAY: 10.10.20.254}
    volumes:
      - ./config/web:/usr/share/nginx/html:ro
    networks:
      perth-servers: {ipv4_address: 10.10.20.80}

  # ── Security monitoring ────────────────────────────────────────────
  # The sensor shares the Perth router's network namespace, so it sees
  # every interface the router has: all three Perth subnets and both WAN
  # links. Passive — it has no address and answers nothing.
  ids:
    build: images/ids
    cap_add: [NET_ADMIN, NET_RAW, SYS_NICE]
    network_mode: "service:perth-router"
    depends_on: [perth-router]
    volumes:
      - ./config/ids:/lab-rules:ro
      - ./logs/suricata:/var/log/suricata

  # Plays a capture file onto the DMZ segment, which has no hosts on it.
  # Because nothing there owns the destination MACs in the capture, every
  # replayed frame is an unknown unicast and the bridge floods it to all
  # ports — including the router's, where the sensor lives. That gives the
  # sensor the whole conversation, which a live segment would not (the
  # bridge would deliver each frame only to the port owning that MAC).
  #   make replay PCAP=incident.pcap
  replay:
    build: images/replay
    cap_add: [NET_ADMIN, NET_RAW]
    profiles: [tools]
    volumes:
      - ./pcaps:/pcaps:ro
    networks:
      perth-dmz: {}

  # ── Workstations (docker compose exec -it <name> bash) ─────────────
  perth-ws1:
    <<: *workstation
    environment: {GATEWAY: 10.10.10.254, DNS: 10.10.20.53}
    networks:
      perth-users: {ipv4_address: 10.10.10.101}

  london-ws1:
    <<: *workstation
    environment: {GATEWAY: 10.20.10.254, DNS: 10.20.10.53}
    networks:
      london-users: {ipv4_address: 10.20.10.101}

  la-ws1:
    <<: *workstation
    environment: {GATEWAY: 10.30.10.254, DNS: 10.30.10.53}
    networks:
      la-users: {ipv4_address: 10.30.10.101}

  pilbara-ws1:
    <<: *workstation
    environment: {GATEWAY: 10.40.10.254, DNS: 10.10.20.53}
    networks:
      pilbara-users: {ipv4_address: 10.40.10.101}

  # ── Background traffic so the network feels alive ──────────────────
  # Each office keeps its own hours. SIM_HOUR compresses time so a full
  # 24-hour cycle takes 24 minutes -- long enough to watch the workday move
  # around the planet, short enough to fit in a lab session.
  london-user-sim:
    <<: *workstation
    environment:
      GATEWAY: 10.20.10.254
      DNS: 10.20.10.53
      TRAFFIC: "1"
      SITE: London
      TZ_OFFSET: "0"
      SIM_HOUR: "${SIM_HOUR:-60}"
    volumes:
      - ./scripts/init-workstation.sh:/init.sh:ro
      - ./scripts/attack-demo.sh:/attack-demo.sh:ro
      - ./scripts/traffic.sh:/traffic.sh:ro
    networks:
      london-users: {ipv4_address: 10.20.10.102}

  la-user-sim:
    <<: *workstation
    environment:
      GATEWAY: 10.30.10.254
      DNS: 10.30.10.53
      TRAFFIC: "1"
      SITE: LA
      TZ_OFFSET: "-8"
      SIM_HOUR: "${SIM_HOUR:-60}"
    volumes:
      - ./scripts/init-workstation.sh:/init.sh:ro
      - ./scripts/attack-demo.sh:/attack-demo.sh:ro
      - ./scripts/traffic.sh:/traffic.sh:ro
    networks:
      la-users: {ipv4_address: 10.30.10.102}

  perth-user-sim:
    <<: *workstation
    environment:
      GATEWAY: 10.10.10.254
      DNS: 10.10.20.53
      TRAFFIC: "1"
      SITE: Perth
      TZ_OFFSET: "8"
      SIM_HOUR: "${SIM_HOUR:-60}"
    volumes:
      - ./scripts/init-workstation.sh:/init.sh:ro
      - ./scripts/attack-demo.sh:/attack-demo.sh:ro
      - ./scripts/traffic.sh:/traffic.sh:ro
    networks:
      perth-users: {ipv4_address: 10.10.10.102}

  pilbara-user-sim:
    <<: *workstation
    environment:
      GATEWAY: 10.40.10.254
      DNS: 10.10.20.53
      TRAFFIC: "1"
      SITE: Pilbara
      TZ_OFFSET: "8"
      SIM_HOUR: "${SIM_HOUR:-60}"
    volumes:
      - ./scripts/init-workstation.sh:/init.sh:ro
      - ./scripts/attack-demo.sh:/attack-demo.sh:ro
      - ./scripts/traffic.sh:/traffic.sh:ro
    networks:
      pilbara-users: {ipv4_address: 10.40.10.102}

networks:
  perth-users:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.10.10.0/24}]}
  perth-servers:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.10.20.0/24}]}
  perth-dmz:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.10.30.0/24}]}
  london-users:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.20.10.0/24}]}
  la-users:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.30.10.0/24}]}
# Docker claims the "gateway" address on every bridge for the host; the
# default is .1, which is where the routers live on the WAN /24s — so the
# bridge address is pushed out of the way to .200.
  wan-perth-london:
    driver_opts: *routed
    ipam: {config: [{subnet: 172.16.1.0/24, gateway: 172.16.1.200}]}
  wan-perth-la:
    driver_opts: *routed
    ipam: {config: [{subnet: 172.16.2.0/24, gateway: 172.16.2.200}]}
  wan-perth-pilbara:
    driver_opts: *routed
    ipam: {config: [{subnet: 172.16.4.0/24, gateway: 172.16.4.200}]}
  pilbara-users:
    driver_opts: *routed
    ipam: {config: [{subnet: 10.40.10.0/24}]}
  wan-london-la:
    driver_opts: *routed
    ipam: {config: [{subnet: 172.16.3.0/24, gateway: 172.16.3.200}]}
